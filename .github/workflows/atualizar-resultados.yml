name: Atualizar resultados da Federal

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Consultar a CAIXA e atualizar JSON
        run: python scripts/coletar_caixa.py

      - name: Salvar atualização no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/federal.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos resultados."
          else
            git commit -m "Atualiza resultados oficiais da Federal"
            git push
          fi
